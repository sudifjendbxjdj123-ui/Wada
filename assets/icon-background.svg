<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    WADA — Android Adaptive Icon Background (1024×1024)
    ─────────────────────────────────────────────────────────────────
    Couche fond sous le foreground. Plein bleed, jamais rogné. Reste
    visible quel que soit le masque utilisateur (cercle, squircle…).
    Cream paper WADA + grain subtil pour ancrer la DA éditoriale.
    ─────────────────────────────────────────────────────────────── */
  -->
  <rect width="1024" height="1024" fill="#F4EFE6"/>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0.06 0"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <rect width="1024" height="1024" fill="#F4EFE6" filter="url(#grain)" opacity="0.6"/>
</svg>
