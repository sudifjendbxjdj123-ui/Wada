    <use href="#cloud-d" x="340"  y="900"  width="55" height="37" />
    <use href="#cloud-d" x="640"  y="940"  width="60" height="40" transform="rotate(-18 670 960)" />
    <use href="#cloud-d" x="930"  y="900"  width="50" height="33" />
    <use href="#cloud-d" x="1210" y="950"  width="60" height="40" transform="rotate(12 1240 970)" />
    <use href="#cloud-d" x="80"   y="1200" width="55" height="37" />
    <use href="#cloud-d" x="380"  y="1180" width="60" height="40" transform="rotate(-15 410 1200)" />
    <use href="#cloud-d" x="680"  y="1220" width="50" height="33" />
