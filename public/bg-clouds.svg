    <use href="#cloud-a" x="710"   y="710"  width="110" height="73" transform="rotate(-12 765 746)" />
    <use href="#cloud-a" x="990"   y="760"  width="120" height="80" transform="rotate(10 1050 800)" />
    <use href="#cloud-a" x="1260"  y="700"  width="100" height="67" transform="rotate(-8 1310 733)" />

    <use href="#cloud-a" x="80"    y="1040" width="110" height="73" />
    <use href="#cloud-a" x="380"   y="960"  width="120" height="80" transform="rotate(12 440 1000)" />
    <use href="#cloud-a" x="680"   y="980"  width="100" height="67" transform="rotate(-10 730 1013)" />
    <use href="#cloud-a" x="970"   y="1030" width="110" height="73" transform="rotate(8 1025 1066)" />
    <use href="#cloud-a" x="1260"  y="980"  width="120" height="80" />

    <use href="#cloud-a" x="140"   y="1300" width="100" height="67" transform="rotate(-10 190 1333)" />
    <use href="#cloud-a" x="440"   y="1240" width="110" height="73" />
    <use href="#cloud-a" x="730"   y="1300" width="120" height="80" transform="rotate(8 790 1340)" />
    <use href="#cloud-a" x="1010"  y="1240" width="100" height="67" transform="rotate(-12 1060 1273)" />
    <use href="#cloud-a" x="1290"  y="1300" width="110" height="73" />
  </g>

  <!-- ════════════════════════════════════════════════════════════
       COUCHE 4 — Fillers (Cloud D, volutes vertes) + perles + vagues
       ════════════════════════════════════════════════════════════ -->
  <g>
    <use href="#cloud-d" x="80"   y="120"  width="60" height="40" transform="rotate(20 110 140)" />
    <use href="#cloud-d" x="370"  y="160"  width="50" height="33" />
    <use href="#cloud-d" x="660"  y="100"  width="60" height="40" transform="rotate(-15 690 120)" />
    <use href="#cloud-d" x="940"  y="150"  width="55" height="37" />
    <use href="#cloud-d" x="1210" y="220"  width="60" height="40" transform="rotate(10 1240 240)" />
    <use href="#cloud-d" x="40"   y="420"  width="55" height="37" />
    <use href="#cloud-d" x="340"  y="380"  width="60" height="40" transform="rotate(-20 370 400)" />
    <use href="#cloud-d" x="620"  y="420"  width="50" height="33" />
    <use href="#cloud-d" x="930"  y="380"  width="60" height="40" transform="rotate(15 960 400)" />
