  <!-- ════════════════════════════════════════════════════════════
       TEXTURE TISSU par-dessus — donne le grain woven
       ════════════════════════════════════════════════════════════ -->
  <rect width="1400" height="1400" fill="#1F1B16" filter="url(#weave)" opacity="0.55" />
</svg>
