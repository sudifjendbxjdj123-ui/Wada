    <use href="#cloud-c" x="1230"  y="330"  width="240" height="144" />

    <use href="#cloud-c" x="-20"   y="580"  width="280" height="168" transform="rotate(-2 120 664)" />
    <use href="#cloud-c" x="300"   y="540"  width="270" height="162" />
    <use href="#cloud-c" x="610"   y="600"  width="260" height="156" transform="rotate(3 740 678)" />
    <use href="#cloud-c" x="900"   y="550"  width="270" height="162" transform="rotate(-2 1035 631)" />
    <use href="#cloud-c" x="1200"  y="590"  width="270" height="162" />

    <use href="#cloud-c" x="50"    y="850"  width="260" height="156" transform="rotate(2 180 928)" />
    <use href="#cloud-c" x="340"   y="810"  width="280" height="168" />
    <use href="#cloud-c" x="650"   y="870"  width="270" height="162" transform="rotate(-3 785 951)" />
    <use href="#cloud-c" x="960"   y="820"  width="260" height="156" transform="rotate(3 1090 898)" />
    <use href="#cloud-c" x="1240"  y="860"  width="270" height="162" />

    <use href="#cloud-c" x="-30"   y="1110" width="270" height="162" />
    <use href="#cloud-c" x="290"   y="1070" width="280" height="168" transform="rotate(-2 430 1154)" />
    <use href="#cloud-c" x="600"   y="1130" width="260" height="156" transform="rotate(2 730 1208)" />
    <use href="#cloud-c" x="900"   y="1080" width="270" height="162" />
    <use href="#cloud-c" x="1200"  y="1120" width="270" height="162" transform="rotate(-3 1335 1201)" />
  </g>

