       ════════════════════════════════════════════════════════════ -->
  <g>
    <use href="#cloud-b" x="180"   y="180"  width="200" height="113" transform="rotate(8 280 236)" />
    <use href="#cloud-b" x="470"   y="200"  width="180" height="101" transform="rotate(-6 560 250)" />
    <use href="#cloud-b" x="760"   y="220"  width="200" height="113" />
    <use href="#cloud-b" x="1060"  y="200"  width="190" height="107" transform="rotate(5 1155 253)" />

    <use href="#cloud-b" x="170"   y="450"  width="190" height="107" transform="rotate(-5 265 503)" />
    <use href="#cloud-b" x="490"   y="470"  width="200" height="113" transform="rotate(6 590 526)" />
    <use href="#cloud-b" x="790"   y="450"  width="190" height="107" />
    <use href="#cloud-b" x="1080"  y="470"  width="200" height="113" transform="rotate(-4 1180 526)" />

    <use href="#cloud-b" x="200"   y="730"  width="200" height="113" />
    <use href="#cloud-b" x="510"   y="720"  width="190" height="107" transform="rotate(-7 605 773)" />
    <use href="#cloud-b" x="800"   y="740"  width="200" height="113" transform="rotate(5 900 796)" />
    <use href="#cloud-b" x="1090"  y="720"  width="180" height="101" />

    <use href="#cloud-b" x="180"   y="1000" width="200" height="113" transform="rotate(6 280 1056)" />
    <use href="#cloud-b" x="490"   y="980"  width="190" height="107" />
    <use href="#cloud-b" x="780"   y="1000" width="200" height="113" transform="rotate(-5 880 1056)" />
    <use href="#cloud-b" x="1070"  y="980"  width="200" height="113" transform="rotate(4 1170 1036)" />

    <use href="#cloud-b" x="220"   y="1260" width="180" height="101" transform="rotate(-3 310 1310)" />
    <use href="#cloud-b" x="520"   y="1280" width="200" height="113" />
    <use href="#cloud-b" x="830"   y="1260" width="190" height="107" transform="rotate(4 925 1313)" />
    <use href="#cloud-b" x="1120"  y="1280" width="200" height="113" />
  </g>

  <!-- ════════════════════════════════════════════════════════════
       COUCHE 3 — Petits nuages (Cloud A) en remplissage
       ════════════════════════════════════════════════════════════ -->
  <g>
    <use href="#cloud-a" x="120"   y="240"  width="120" height="80" transform="rotate(15 180 280)" />
    <use href="#cloud-a" x="410"   y="120"  width="100" height="67" transform="rotate(-10 460 153)" />
    <use href="#cloud-a" x="690"   y="160"  width="110" height="73" transform="rotate(8 745 196)" />
    <use href="#cloud-a" x="950"   y="180"  width="120" height="80" transform="rotate(-12 1010 220)" />
    <use href="#cloud-a" x="1240"  y="130"  width="100" height="67" />

    <use href="#cloud-a" x="60"    y="520"  width="110" height="73" transform="rotate(10 115 556)" />
    <use href="#cloud-a" x="370"   y="430"  width="120" height="80" transform="rotate(-8 430 470)" />
    <use href="#cloud-a" x="680"   y="450"  width="100" height="67" transform="rotate(12 730 483)" />
