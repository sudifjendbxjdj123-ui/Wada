    <use href="#cloud-d" x="1260" y="1230" width="55" height="37" />
  </g>

  <!-- Vagues horizontales discrètes pour structurer les rangées -->
  <g opacity="0.65">
    <use href="#wave-a" x="0"    y="260"  width="700"  height="40" />
    <use href="#wave-a" x="700"  y="270"  width="700"  height="40" />
    <use href="#wave-a" x="0"    y="525"  width="700"  height="40" />
    <use href="#wave-a" x="700"  y="535"  width="700"  height="40" />
    <use href="#wave-a" x="0"    y="790"  width="700"  height="40" />
    <use href="#wave-a" x="700"  y="800"  width="700"  height="40" />
    <use href="#wave-a" x="0"    y="1055" width="700"  height="40" />
    <use href="#wave-a" x="700"  y="1065" width="700"  height="40" />
  </g>

  <!-- Bead chains de transition entre rangées -->
  <g>
    <use href="#beads" x="240"  y="270"  width="80" height="12" />
    <use href="#beads" x="800"  y="280"  width="80" height="12" />
    <use href="#beads" x="120"  y="540"  width="80" height="12" />
    <use href="#beads" x="640"  y="548"  width="80" height="12" />
    <use href="#beads" x="1080" y="540"  width="80" height="12" />
    <use href="#beads" x="320"  y="805"  width="80" height="12" />
    <use href="#beads" x="880"  y="812"  width="80" height="12" />
    <use href="#beads" x="160"  y="1070" width="80" height="12" />
    <use href="#beads" x="720"  y="1078" width="80" height="12" />
    <use href="#beads" x="1140" y="1070" width="80" height="12" />
