<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <!-- Post 3 · Slide 3 (CTA) — "348 histoires" -->
  <rect width="1080" height="1350" fill="#F4EFE6"/>

  <!-- Eyebrow -->
  <text x="540" y="350"
        font-family="Inter, Arial, sans-serif"
        font-size="22" font-weight="700"
        letter-spacing="10" fill="#C44E3A"
        text-anchor="middle">
    LE DICTIONNAIRE WADA
  </text>

  <!-- Chiffre 348 ultra gros -->
  <text x="540" y="700"
        font-family="'Bagel Fat One', 'Abril Fatface', Georgia, serif"
        font-size="320" font-weight="400" fill="#1F1B16"
        text-anchor="middle">
    348
  </text>

  <!-- Sous-texte -->
  <text x="540" y="800"
        font-family="Georgia, 'EB Garamond', serif"
        font-size="44" font-style="italic" fill="#1F1B16"
        text-anchor="middle">
    histoires chromatiques.
  </text>

  <!-- Ligne fine -->
  <line x1="440" y1="880" x2="640" y2="880" stroke="#C44E3A" stroke-width="2"/>

  <!-- Texte secondaire -->
  <text x="540" y="970"
        font-family="Georgia, 'EB Garamond', serif"
        font-size="28" fill="#1F1B16" opacity="0.7"
        text-anchor="middle">
    Une pour chaque jour de l'année.
  </text>
  <text x="540" y="1010"
        font-family="Georgia, 'EB Garamond', serif"
        font-size="28" fill="#1F1B16" opacity="0.7"
        text-anchor="middle">
    Plus de trois mois en réserve.
  </text>

  <!-- CTA URL -->
  <rect x="340" y="1150" width="400" height="78" rx="40" fill="#1F1B16"/>
  <text x="540" y="1202"
        font-family="Inter, Arial, sans-serif"
        font-size="22" font-weight="700"
        letter-spacing="6" fill="#F4EFE6"
        text-anchor="middle">
    DÉCOUVRIR  →
  </text>
</svg>
